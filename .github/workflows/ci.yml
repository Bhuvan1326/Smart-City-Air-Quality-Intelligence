name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_DB: airquality_test
          POSTGRES_USER: airuser
          POSTGRES_PASSWORD: airpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U airuser -d airquality_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgeos-dev \
            libproj-dev \
            libgdal-dev \
            gdal-bin \
            postgresql-client

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # IMPORTANT:
      # These tools were previously missing from the GitHub runner.
      - name: Install development and CI tools
        run: |
          python -m pip install \
            black \
            isort \
            ruff \
            pytest \
            pytest-cov

      - name: Verify installed tools
        run: |
          python --version
          black --version
          isort --version
          ruff --version
          pytest --version

      - name: Setup test database
        env:
          PGPASSWORD: airpass
        run: |
          psql \
            -h localhost \
            -U airuser \
            -d airquality_test \
            -c "CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";" \
            -c "CREATE EXTENSION IF NOT EXISTS postgis;" \
            -c "CREATE EXTENSION IF NOT EXISTS timescaledb CASCADE;"

      - name: Run Black
        working-directory: backend
        run: black --check app/

      - name: Run isort
        working-directory: backend
        run: isort --check-only app/

      - name: Run Ruff
        working-directory: backend
        run: ruff check app/

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://airuser:airpass@localhost:5432/airquality_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-min-32-chars-long-xx
          ENVIRONMENT: development
        run: |
          pytest \
            --cov=app \
            --cov-report=xml \
            --cov-fail-under=80

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          fail_ci_if_error: false

  frontend-lint:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      # Next.js 15.5 deprecates `next lint`.
      # Use ESLint directly instead.
      - name: Lint
        working-directory: frontend
        run: npx eslint .

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - frontend-lint
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: urban-air-quality/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: urban-air-quality/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          