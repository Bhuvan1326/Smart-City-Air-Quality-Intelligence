[project]
name = "smart-city-air-quality-intelligence"
version = "0.1.0"
description = "Smart City Air Quality Intelligence Platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "asyncpg",
    "alembic",
    "redis",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "httpx",
    "python-multipart",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88

[tool.ruff.lint]
ignore = ["EXE002", "DTZ001", "SIM117", "S110", "BLE001"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Security",
    "fastapi.Form",
]