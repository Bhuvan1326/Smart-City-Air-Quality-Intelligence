[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function
testpaths = app/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    integration: test requires a live PostgreSQL connection (uses db_session/client/test_admin/admin_token/auth_headers fixtures). Run without a DB via: pytest -m "not integration"
addopts = -v --tb=short --cov=app --cov-report=term-missing --cov-fail-under=80
